# Root's storage in a workspace: on the workspace's volume, so that overlay is mounted on the
# volume's own filesystem (native overlay), and the run folder on the tmpfs the wrapper mounts in
# its nest. Another user keeps Podman's default storage in their home, which is in the volume too.
[storage]
driver="overlay"
graphroot="/rcman/containers/storage"
runroot="/run/containers/storage"
