# Podman's configuration in a workspace (backend/rcman/podman/podman reads it, as root and as
# any other user), and on the tests' engine. A container nested in a workspace has pid, UTS and
# IPC namespaces of its own and shares the workspace's network, user and cgroup namespaces;
# the workspace has no cgroups to give it. Where root's state goes is the wrapper's and
# Podman's defaults, never a folder named here.
[containers]
pidns="private"
utsns="private"
ipcns="private"
netns="host"
userns="host"
cgroupns="host"
cgroups="disabled"
log_driver="k8s-file"
init_path="/usr/bin/catatonit"

[engine]
cgroup_manager="cgroupfs"
events_logger="file"
runtime="crun"
