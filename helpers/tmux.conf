# tmux configuration for the rcman socket. Servers keep their pane after the
# program exits, so the final screen and exit status can still be read.
set -g remain-on-exit on
set -g remain-on-exit-format ""
set -g history-limit 2000
# No global window-size: rc-helper pins each server's window to its size
# (Tmux.pin), since a global `window-size manual` makes tmux 3.4's server exit at
# the next detached new-session; test_tmux_conf_sets_no_global_window_size.
