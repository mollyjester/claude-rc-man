[project]
name = "claude-rc-man"
version = "0.0.0"
description = "Self-hosted web service to control Claude Code Remote Control servers"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE.md"]
dependencies = [
    "fastapi>=0.142.2",
    "h11>=0.16.0",
    "pydantic-settings>=2.15.0",
    "uvicorn>=0.54.0",
    "websockets>=17.2",
]

[project.scripts]
rcman-admin = "rcman.admin:main"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest",
    "pytest-timeout>=2.4.0,<2.5",  # tests/conftest.py mirrors its timeout_timer
    "pytest-xdist>=3.8.0",
    "ruff",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["helpers", "backend/rcman"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers -m 'not real_claude and not benchmark'"
# The hang guard (pytest-timeout): a test still running this many seconds after its setup began
# is ended, with the stacks of every thread. timeout is every test's; container_timeout, which
# tests/conftest.py registers, the container tests' instead, the image builds of their session
# fixtures charged to them. Each is far beyond any plausible slowness of its tier, so it ends only
# a genuine hang. "thread" ends the test's whole process, whatever it is blocked in;
# project-knowledge/tests.md, "The hang guard", says why. tests/hang_guard.py reads the values.
timeout = 600
container_timeout = 3600
timeout_method = "thread"
markers = [
    "container: derived in tests/container_marker.py from the podman_service fixture, the tests' own Podman engine: the test needs a container",
    "stack: the whole stack in a browser, in a container; run on demand by make check-ui, not by make test-container",
    "real_claude: needs a logged-in Claude account; run by hand with -m real_claude",
    "benchmark: measures and reports, and decides no gating run; run on demand by make benchmark alone",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency idiom: these calls build markers, not shared mutable defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "rcman.audit.Recorder", "rcman.audit.Session"]
