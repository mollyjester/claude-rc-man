# oauth2-proxy for rcman, written by install.sh. Signs people in with Google;
# only the addresses in the allowed list, which rcman writes from its people, get through.
provider = "google"
client_id = "@GOOGLE_CLIENT_ID@"
client_secret = "@GOOGLE_CLIENT_SECRET@"
cookie_secret = "@COOKIE_SECRET@"
cookie_secure = true
redirect_url = "https://@DOMAIN@/oauth2/callback"
http_address = "127.0.0.1:@PROXY_PORT@"
reverse_proxy = true
authenticated_emails_file = "@STATE@/allowed-emails"
upstreams = ["static://202"]
set_xauthrequest = true
skip_provider_button = true
