name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      RCMAN_REQUIRE_REAL_CLAUDE: "1"
      RCMAN_REQUIRE_CONTAINER: "1"
      DISABLE_AUTOUPDATER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq tmux
      - name: Install the Claude Code version the fixtures were recorded from
        run: |
          version=$(python3 -c 'import json; print(json.load(open("tests/fakes/fixtures/manifest.json"))["claude_version"])')
          curl -fsSL https://claude.ai/install.sh | bash -s "$version"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: uv sync --locked
      - run: cd frontend && npm ci && npx playwright install --with-deps chromium
      - run: make check
